# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI (`cargo deny check advisories bans`). Since cargo-deny 0.20 every
# vulnerability, unsound and notice advisory is an error; yanked releases are
# denied here too. The unmaintained transitive crates have no upgrade and
# sit behind crates we do use, so they are ignored with a reason (unsafe-libyaml
# rides along with serde_yaml — the same config-parser migration as yaml-rust).

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "warn"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 via syntect — finished, no compatible successor" },
    { id = "RUSTSEC-2024-0384", reason = "instant via notify — the web-time swap must happen upstream in notify" },
    { id = "RUSTSEC-2024-0436", reason = "paste via image→exr — archived; a drop-in fork (pastey) is upstream's call" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust via serde_yaml — migrating the config parser is a separate task" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml — same config-parser migration as yaml-rust above" },
]

[bans]
# Duplicate versions are visible but not failures — the tree is mostly
# transitive (tokenizers, reqwest, tungstenite). Wildcards: the two hits are the
# workspace path dependency (`rijo-core`) and the `subsecond` git dependency,
# both intentional.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Explicit policy for `cargo deny check`: allow the project license plus the
# common permissive/transitive licenses used by this dependency graph. Review
# additions rather than relying on cargo-deny's implicit default (which rejects
# every expression when no allow-list is configured).
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
